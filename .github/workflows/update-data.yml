name: Refresh dashboard data and deploy

on:
  schedule:
    # Every 6 hours. Edit the cron below to change the cadence.
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Fetch Todoist + Calendar data
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          GCAL_PRIMARY_ICS_URL: ${{ secrets.GCAL_PRIMARY_ICS_URL }}
          GCAL_IE_ICS_URL: ${{ secrets.GCAL_IE_ICS_URL }}
        run: npm run fetch-data

      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/data.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - id: deployment
        uses: actions/deploy-pages@v4
